# The maximum number of homes a player can set.
max-homes: 15

# Land-protection wand. Players hold this item and click chunk corner blocks
# to set Pos1 (left-click) and Pos2 (right-click) before running
# /region claim <name>. Must be a Material name from the Bukkit registry;
# falls back to REDSTONE if the name doesn't resolve.
protection:
  selection-tool: STONE_AXE
  # Claim pricing formula: base * decay-rate^(chunks already owned), floored at minimum-per-chunk.
  # Not retroactive - only affects claims priced after a change.
  claim-cost:
    base: 10.0
    decay-rate: 1.1
    minimum-per-chunk: 1
  # Worlds where any player may run /region claim without holding
  # tweaks.protection.purchaseable. Entries are namespaced world keys
  # (e.g. "minecraft:overworld"), matched case-insensitively. For non-admins, the
  # claim price, per-player chunk limit, and every overlap/geometry check still apply -
  # only the permission requirement is waived, and only for claim (setparent/unsetparent
  # still require the permission in every world). Admins retain their free/unlimited
  # bypass. An empty list keeps non-admin claiming permission-gated everywhere.
  public-claim-worlds: []

# Maximum number of chunks a single player may own through the purchase system.
max_chunks: 200

# Drop chance percentage for Egg Collector enchantment (0.0 - 100.0).
egg-collector-drop-chance: 0.5

# Worlds where the end portal is disabled.
disabled-end-portal-worlds:
  - "jass:archive"
  - "jass:resource"

# Worlds where fly is enabled by default.
fly-worlds:
  - "jass:archive"
  - "jass:lobby"

# Flight permission advancement
fly-advancement: "jass:fly"

# Namespaced key of the custom enchantments.
telekinesis: "jass:telekinesis"
smelter: "jass:smelter"
lumberjack: "jass:lumberjack"
gem-connoisseur: "jass:gem_connoisseur"
tunneller: "jass:tunneller"
spawner-pickup: "jass:spawner_pickup"
egg-collector: "jass:egg_collector"
replant: "jass:replant"
efficacy: "jass:efficacy"
dice-converter: "dqc.dice:dice_converter"

