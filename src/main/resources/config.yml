# Daily login reward streak multipliers (day 1 through day 7). Reward = base * multiplier (+ rank bonus).
economy:
  daily-reward-base: 100.0
  streak-multipliers:
    1: 1.0
    2: 1.1
    3: 1.2
    4: 1.3
    5: 1.4
    6: 1.5
    7: 1.6

# Lottery pot maths:
#   pot = pot-multiplier x (House balance - baseline) x (1 + 0.01 x entrant count)
# pot-multiplier: 0.6 is the default. Raise it (for example 1.2) to increase lottery payouts
#   during a "House is feeling generous" event. At 1.0 or above, the pot exceeds the House's
#   growth since the last draw, so the House Balance itself is drawn down below its baseline.
# reseed-amount: the base fallback floor. The House balance is never paid below the live
#   fallback, and the live fallback snaps back to this base after a successful draw. The live
#   value is stored in data/lottery/lottery.yml and grows when a draw is attempted with only
#   one entrant.
lottery:
  reseed-amount: 10000
  pot-multiplier: 0.6

discord:
  # Numeric Discord channel ID for Tweaks announcements. Leave empty to disable.
  # Must be quoted: an 18-digit ID is not safe to carry as a YAML number.
  # Do not also add this channel to DiscordSRV's Channels map; that would make it a two-way chat bridge.
  channel-id: ""
  # Name the bot posts under in the announcement channel.
  webhook-name: "House"
  # Publicly reachable image URL used as the bot's picture. Leave empty for the webhook default.
  # Lottery winner cards ignore this and show the winning player's skin instead.
  webhook-avatar-url: ""
  # Channel where the Tweaks slash commands are accepted. Leave empty to disable them.
  betting-channel-id: ""
  # Master switch for Discord-originated betting.
  betting-enabled: true
  # Seconds to collect casino settlements before posting them as one grouped code block.
  group-window-seconds: 2
  # Voice channels whose names display live figures. Leave empty to disable each one.
  house-channel-id: ""
  lottery-channel-id: ""
  stat-refresh-seconds: 300

# Player ranks. Rank 0 = unranked (no name/cost/bonus). Ranks 1..10 are purchasable in order via /rankup.
# multiplier = rank bonus applied to daily login rewards. rakeback = casino rakeback rate. Both are fractions (0.01 = 1%).
ranks:
  1:  { name: "I",    cost: 1000.0,   multiplier: 0.01, rakeback: 0.01 }
  2:  { name: "II",   cost: 2500.0,   multiplier: 0.02, rakeback: 0.02 }
  3:  { name: "III",  cost: 5000.0,   multiplier: 0.03, rakeback: 0.03 }
  4:  { name: "IV",   cost: 10000.0,  multiplier: 0.04, rakeback: 0.04 }
  5:  { name: "V",    cost: 20000.0,  multiplier: 0.05, rakeback: 0.05 }
  6:  { name: "VI",   cost: 40000.0,  multiplier: 0.06, rakeback: 0.06 }
  7:  { name: "VII",  cost: 75000.0,  multiplier: 0.07, rakeback: 0.07 }
  8:  { name: "VIII", cost: 125000.0, multiplier: 0.08, rakeback: 0.08 }
  9:  { name: "IX",   cost: 200000.0, multiplier: 0.09, rakeback: 0.09 }
  10: { name: "X",    cost: 350000.0, multiplier: 0.10, rakeback: 0.10 }

# Runtime-editable defaults for the live block-log and death-inventory settings.
blocklog:
  retention-days: 30
  max-entries-per-chest: 500

deathinventory:
  retention-days: 30

enchantments:
  spawner-pickup:
    drop-chance-percent: 20.0
    uses: 5
  egg-collector:
    uses: 5
  quality:
    chance-percent: 10.0
    blood-moon-chance-percent: 50.0
  lumberjack:
    max-logs: 256

# Live XP-economy settings. Mob XP removal deliberately skips player death XP.
xp:
  mob-drops:
    remove: true
  custom-drops:
    enabled: true
    amount: 1
    crop-chance-percent: 5.0
    leaf-break-chance-percent: 5.0
    leaf-decay-chance-percent: 5.0
    stone-chance-percent: 5.0
    stone-materials:
      - stone
      - deepslate
      - granite
      - diorite
      - andesite
      - tuff
      - netherrack
      - basalt
      - blackstone
      - calcite
      - cobblestone
    leaf-materials:
      - oak_leaves
      - spruce_leaves
      - birch_leaves
      - jungle_leaves
      - acacia_leaves
      - dark_oak_leaves
      - mangrove_leaves
      - cherry_leaves
      - pale_oak_leaves
      - azalea_leaves
      - flowering_azalea_leaves
    taint-ttl-days: 30
  mending:
    enabled: true
    dollars-per-xp: 1
    enchantment-key: minecraft:mending

# Live player tools. All datapack-coupled item models and enchantment keys are editable through
# /tconfig; items are recognized by PDC markers rather than display text.
tools:
  augments:
    enabled: true
    gem-material: AMETHYST_SHARD
    gem-item-model: jass:augment_gem
    # Slot prices are in player levels. Unlisted slots use the highest configured price;
    # an empty price map makes slots unpriced rather than free.
    slot-prices:
      1: 30
      2: 35
      3: 40
      4: 45
      5: 50
      6: 55
      7: 60
      8: 65
      9: 70
      10: 75
      11: 80
    # Capacity accepts shared material families and exact material overrides.
    # Exact material keys win over their family; leather, chainmail, and turtle armor
    # resolve through the wooden, stone, and iron families respectively.
    # Configured capacities remain exact for purchases; indicators above 64 slots abbreviate with an ellipsis.
    slot-capacity:
      wooden: 3
      stone: 4
      iron: 5
      copper: 5
      gold: 5
      diamond: 7
      netherite: 11
      shears: 6
      fishing_rod: 6
      mace: 11
      elytra: 7
    # Used when neither an exact material nor a family key has a configured value.
    slot-capacity-default: 5
    quality-slot-cost:
      none: 1
      uncommon: 2
      rare: 3
      epic: 4
      legendary: 5
    enforce-vanilla-exclusivity: true
    convert-enchanted-books: true
  repair-kit:
    enabled: true
    material: PAPER
    item-model: jass:repair_kit
    durability-multiplier: 3.0
    max-tier: 9
    tier-step-percent: 10.0
    recipe:
      - iron_ingot
      - iron_ingot
      - iron_ingot
      - iron_ingot
      - nether_star
      - iron_ingot
      - iron_ingot
      - iron_ingot
      - iron_ingot
    recipe-shapeless: false
  never-break:
    # When enabled, augmented items stop at one durability remaining, stay in the inventory,
    # and become unusable; plain items still break normally. When disabled, augmented items
    # also break normally.
    enabled: true
  anvil:
    lockout-enabled: true
    grindstone-lockout-enabled: true
  rename:
    enabled: true
    max-length: 50
  cash-item:
    enabled: true
    pdc-key: cash

itemadmin:
  tool-protect:
    default-threshold: 100
    warn-cooldown-ms: 2000
  gui-copy:
    max-distance: 8

xpbottle:
  # Restart-required: also baked into a registered brewing recipe at boot.
  orbs-per-emerald: 1395

minigames:
  blackjack:
    inactivity-timeout-minutes: 10
    auto-clear-seconds: 30
  roulette:
    betting-window-seconds: 30
    big-win-multiplier: 8
    scan-radius: 16
  resource-hunt:
    default-reward-multiplier: 2.0

playeradmin:
  afk-auto-minutes: 10
  max-nick-length: 24

teleport:
  tpa-timeout-seconds: 30
  sethome-disabled-worlds:
    - "jass:resource"
    - "jass:resource_nether"

worldmanagement:
  blood-moon-chance-percent: 50.0
  # When true, a completed trade with a villager or wandering trader no longer
  # drops experience orbs to the player. The villager still gains its own trade
  # experience and levels up as normal. Read live - a /tconfig change applies
  # immediately with no restart.
  villager-trade-xp-disabled: true

# Worlds where the nether portal is disabled.
disabled-nether-portal-worlds:
  - "jass:resource"
  - "jass:resource_nether"

# World-key -> inventory/XP profile + tab-list display mapping, replacing what used to be hardcoded
# in profiles/SeparatorListener and tab/TabManager. Owned exclusively by profiles/WorldProfileTable
# - admin-editable via `/tconfig world-profiles <list|add|remove|edit>` or the /tconfig gui.
#
# Stored as a LIST (not a map keyed by world-key) deliberately: Tweaks#reconcileConfigDefaults'
# sticky copyDefaults(true) union-merges a live section's child keys with this bundled default on
# every read, so a keyed map would silently resurrect a removed default entry on the next reload. A
# list is replaced atomically, avoiding that.
#
# IMPORTANT: a world key's `profile` here is NOT safely renameable after the fact - "profile" is a
# literal prefix of the ec_<profile>/xp_<profile> storage keys StorageManager persists player data
# under (see profiles/CLAUDE.md). Changing an existing entry's profile orphans that world's already-
# stored inventories/ender chests/XP with no migration path. `/tconfig world-profiles edit` only
# ever touches tag/color for this reason - only a brand-new `add` may specify a profile.
world-profiles:
  - world: "jass:lobby"
    profile: lobby
    tag: "Lobby"
    color: AQUA
  - world: "jass:archive"
    profile: archive
    tag: "Archive"
    color: GOLD
  - world: "jass:pi"
    profile: pi
    tag: "Pi"
    color: LIGHT_PURPLE
  - world: "minecraft:overworld"
    profile: standard
    tag: "Survival"
    color: GREEN
  - world: "minecraft:the_nether"
    profile: standard
    tag: "Nether"
    color: LIGHT_PURPLE
  - world: "minecraft:the_end"
    profile: standard
    tag: "End"
    color: DARK_PURPLE
  - world: "jass:resource"
    profile: standard
    tag: "Resource"
    color: AQUA
  - world: "jass:resource_nether"
    profile: standard
    tag: "Resource"
    color: AQUA

# Applied to any world key not matched (exactly or by substring) above. Always present - removing
# every world-profiles entry is legal and simply routes every world through this fallback.
world-profile-fallback:
  profile: standard
  tag: "Survival"
  color: GREEN

# Scoreboard-team sort order (tab_<key>) per profile. A profile missing here still works - it just
# sorts after every profile listed here, in an unspecified but stable order.
world-profile-sort-order:
  lobby: a
  standard: b
  archive: c
  pi: d

# Console event records are individually disabled by default. Changes made through /tconfig take
# effect immediately after the confirmed save; editing this file while the server is running does
# not update the live cache and requires a restart.
logging:
  # Balance mutations, rewards, and house-account outcomes.
  economy:
    balance-set: false
    balance-add: false
    balance-remove: false
    daily-reward-claimed: false
    house-mutated: false
    house-payment-completed: false
  # Blackjack bets, settlements, and table administration.
  blackjack:
    bet-placed: false
    hand-settled: false
    table-mutated: false
  # Roulette bets, spins, board administration, and diagnostics.
  roulette:
    bet-placed: false
    spin-settled: false
    board-mutated: false
    scan-run: false
  # Lottery entries and administrative draw settings.
  lottery:
    entered: false
    draw-completed: false
    baseline-changed: false
    fallback-changed: false
  # Claims, flags, membership changes, and collapsed protection denials.
  protection:
    claim-created: false
    claim-removed: false
    flag-changed: false
    member-changed: false
    block-break-denied: false
    block-place-denied: false
    entry-denied: false
    container-denied: false
  # Custom permission and group administration.
  permissions:
    group-mutated: false
    permission-mutated: false
    user-groups-changed: false
  # Rank administration and purchases.
  ranks:
    admin-set: false
    purchased: false
  # TPA, homes, and server warps.
  teleport:
    tpa-accepted: false
    home-set: false
    admin-home-deleted: false
    warp-set: false
    warp-deleted: false
  # Player administration actions and AFK transitions.
  playeradmin:
    gamemode-changed: false
    fly-toggled: false
    nick-changed: false
    afk-auto: false
  # World-profile changes applied to a player.
  profiles:
    switch-applied: false
  # Item editing and inventory administration.
  itemadmin:
    item-edited: false
    gui-copy-saved: false
    condense-run: false
    invsee-opened: false
  # Death-inventory capture and restoration.
  deathinventory:
    captured: false
    admin-restored: false
  # Inspector mode and retention cleanup.
  blocklog:
    inspector-toggled: false
    retention-purged: false
  # Quality rolls and spawner pickup outcomes.
  enchantments:
    quality-roll: false
    spawner-pickup: false
  # Resource Hunt target changes.
  resourcehunt:
    target-assigned: false
    target-rerolled: false
    target-admin-forced: false
  # Whack session and reward outcomes.
  whack:
    session-started: false
    reward-claimed: false
  # Blood Moon transitions and portal denials.
  worldmanagement:
    blood-moon-risen: false
    blood-moon-ended: false
    portal-blocked: false
  # Resource currency crafting.
  recipes:
    currency-crafted: false
  # XP bottle creation and consumption outcomes.
  xpbottle:
    xp-bottled: false
    xp-released: false
  # Runtime configuration changes, including logging toggle changes.
  core:
    config-changed: false
