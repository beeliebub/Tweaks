# Resource Hunt targets. On every server start the plugin picks one entry at
# random as the active hunt for the session.
#
# Tasks are grouped by world (overworld/nether) and category:
#   collect: Any way of obtaining the item (drops, chests, etc.)
#   kill: Kill the targeted entity
#   smelt: Smelt the target item (supports Smelter enchantment)
#   enchant: Enchant the target item (Overworld only)
#   shear: Shear the targeted entity (Overworld only). Supports colored sheep (e.g. red_sheep).
#   breed: Breed the targeted entity
#   craft: Craft the targeted item
#   barter: Receive the target item from a Piglin barter (Nether only)
#
# Each entry within a category is either:
#   <target>: <amount>                  # bare amount; multiplier defaults to 2.0
#   <target>: "<amount>:<multiplier>"   # explicit amount and tier multiplier (>= 1.0)
#
# Each player works through three cumulative tier thresholds:
#   Tier 1 = amount
#   Tier 2 = round(amount * multiplier)
#   Tier 3 = round(amount * multiplier^2)
# Crossing each threshold grants the "resource" reward (claimable with /reward
# claim). Actions only count while inside the active resource world.
#
# Targets are Bukkit Material constants or EntityType names (case-insensitive).

overworld:
  collect:
    iron_ore: "7:2.0"
    raw_copper: "32:1.75"
  kill:
    creeper: "10:2.0"
    dolphin: "5:1.5"
  smelt:
    iron_ingot: "20:1.75"
    cracked_stone_bricks: "30:2.0"
  enchant:
    diamond_hoe: "5:2.0"
    netherite_axe: "2:2.5"
  shear:
    sheep: "20:2.0"
    red_sheep: "2:2.0"
  breed:
    cow: "2:1.5"
    axolotl: "1:2.0"
  craft:
    crafting_table: "12:3.0"
    brewing_stand: "10:2.5"

nether:
  collect:
  kill:
  smelt:
  barter:
    water_bottle: "10:2.5"
  breed:
  craft: